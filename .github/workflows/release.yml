name: Release Windows Application

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10,<2.12" "torchvision>=0.25,<0.27"
          python -m pip install -e ".[desktop,train,dev]"
          python -m pip install "pyinstaller>=6,<7"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -v

      - name: Verify generated documentation
        run: python scripts/sync_docs.py --check

      - name: Build onedir application
        run: pyinstaller packaging/windows.spec --clean --noconfirm

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $modelPath = "dist\HandwrittenDigitRecognizer\_internal\models\mnist_cnn.pth"
          $executablePath = "dist\HandwrittenDigitRecognizer\HandwrittenDigitRecognizer.exe"
          if (-not (Test-Path -LiteralPath $modelPath -PathType Leaf)) {
            throw "Packaged model is missing: $modelPath"
          }
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Packaged executable is missing: $executablePath"
          }

          $process = $null
          try {
            $process = Start-Process -FilePath $executablePath -ArgumentList "--smoke-test" -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(30000)) {
              throw "Packaged application did not finish its smoke test within 30 seconds."
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
            }
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/HandwrittenDigitRecognizer/*" -DestinationPath "dist/HandwrittenDigitRecognizer-windows-x64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HandwrittenDigitRecognizer-windows-x64.zip
          generate_release_notes: true
