name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU runtime and project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10,<2.12" "torchvision>=0.25,<0.27"
          python -m pip install -e ".[desktop,train,dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -v

      - name: Build source distribution and wheel
        run: python -m build

      - name: Import desktop application
        run: python -c "import digit_recognizer.desktop.app"
